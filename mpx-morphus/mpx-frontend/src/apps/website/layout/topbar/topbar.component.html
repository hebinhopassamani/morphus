<header class="sticky top-0 z-99 border-b bg-white/90 backdrop-blur-md dark:bg-neutral-2/90">
  <div class="mx-auto flex w-full max-w-7xl items-center gap-x-4 px-4 py-3 sm:px-6 lg:px-8">
    <!-- Logo menor padronizada com o slogan correto -->
    <a class="inline-flex items-center gap-x-3 rounded-xl" routerLink="/">
      <div class="flex size-9 items-center justify-center rounded-xl border bg-neutral-a3 p-1.5">
        <img src="/logo-icon-sm.png" alt="Morphus logo" class="size-7 object-contain" />
      </div>
      <div class="flex flex-col gap-y-0.5">
        <div class="text-2xl leading-none font-bold tracking-tighter uppercase text-neutral-12">
          MORPHUS
        </div>
        <div class="text-xs leading-none font-medium text-neutral-a10">
          Do que você precisa hoje?
        </div>
      </div>
    </a>

    <div class="flex-auto"></div>

    <!-- Botões de ação alinhados à direita -->
    <div class="flex items-center gap-x-2 sm:gap-x-3">
      <a matButton class="tertiary small" routerLink="/security/signin">
        Entrar
      </a>

      <a matButton class="primary small" routerLink="/security/signup">
        Teste grátis
      </a>

      <div class="mx-0.5 h-5 w-px bg-neutral-a5"></div>

      <button matIconButton (click)="toggleScheme()" aria-label="Alternar tema">
        <mat-icon [svgIcon]="isDark() ? 'sun' : 'moon'" />
      </button>
    </div>
  </div>
</header>
