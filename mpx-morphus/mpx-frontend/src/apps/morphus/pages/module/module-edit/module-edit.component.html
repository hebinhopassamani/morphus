<div class="mx-auto flex w-full max-w-3xl flex-col p-6">
  <!-- Cabeçalho usando title1 e title2 herdados de MorphusComponent -->
  <div class="flex items-center gap-x-3">
    <button matIconButton type="button" (click)="onCancel()">
      <mat-icon svgIcon="arrow-left" />
    </button>
    <div>
      <h2 class="mpx-headline-medium text-neutral-12">{{ title1() }}</h2>
      <p class="mt-0.5 mpx-body-medium text-neutral-a11">{{ title2() }}</p>
    </div>
  </div>

  <!-- Formulário de Edição / Criação usando MorphusValidator -->
  <form class="mt-8 flex flex-col gap-y-5 rounded-xl border border-neutral-a4 bg-white p-6 dark:bg-neutral-2" (ngSubmit)="onSave()">
    <!-- Aplicação -->
    <mat-form-field>
      <mat-label>Aplicação</mat-label>
      <mat-select
        name="applicationId"
        required
        [ngModel]="entity().applicationId"
        (ngModelChange)="updateField('applicationId', $event)"
        #applicationId="ngModel"
      >
        @for (app of context.availableApplications(); track app.id) {
          <mat-option [value]="app.id">{{ app.name }}</mat-option>
        }
      </mat-select>
      <mat-error class="morphus-mat-error">
        <span class="morphus-mat-error-label">{{ validator.showErros(applicationId) }}</span>
      </mat-error>
    </mat-form-field>

    <!-- Nome e Chave (Key) -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <mat-form-field>
        <mat-label>Nome do Módulo</mat-label>
        <input
          matInput
          name="name"
          required
          minlength="3"
          placeholder="Ex: Gestão Financeira"
          [ngModel]="entity().name"
          (ngModelChange)="updateField('name', $event)"
          #moduleName="ngModel"
        />
        <mat-error class="morphus-mat-error">
          <span class="morphus-mat-error-label">{{ validator.showErros(moduleName) }}</span>
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Chave Única (Key)</mat-label>
        <input
          matInput
          name="key"
          required
          pattern="^[A-Z0-9_]+$"
          placeholder="Ex: FINANCIAL_MANAGEMENT"
          [ngModel]="entity().key"
          (ngModelChange)="updateField('key', $event)"
          #moduleKey="ngModel"
        />
        <mat-error class="morphus-mat-error">
          <span class="morphus-mat-error-label">{{ validator.showErros(moduleKey) }}</span>
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Descrição -->
    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <input
        matInput
        name="description"
        placeholder="Descreva a finalidade deste módulo..."
        [ngModel]="entity().description"
        (ngModelChange)="updateField('description', $event)"
        #description="ngModel"
      />
    </mat-form-field>

    <!-- Ações do Formulário -->
    <div class="mt-2 flex items-center justify-end gap-x-3 border-t border-neutral-a4 pt-4">
      <button matButton type="button" (click)="onCancel()">
        Cancelar
      </button>
      <button matButton class="primary" type="submit" [disabled]="loading()">
        <mat-icon svgIcon="check" />
        {{ isEditing() ? 'Salvar Alterações' : 'Criar Módulo' }}
      </button>
    </div>
  </form>
</div>
