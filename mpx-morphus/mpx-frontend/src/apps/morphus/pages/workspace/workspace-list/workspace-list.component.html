<div class="mx-auto flex w-full max-w-7xl flex-col p-6">
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div>
      <h2 class="mpx-headline-medium text-neutral-12">{{ title1() }}</h2>
      <p class="mt-0.5 mpx-body-medium text-neutral-a11">{{ title2() }}</p>
    </div>

    <div class="ms-auto flex shrink-0 gap-x-3">
      <button matButton type="button" (click)="openFilter()">
        <mat-icon svgIcon="sliders-horizontal" />
        Filtrar
      </button>

      <button matButton class="primary" (click)="newEntity()">
        <mat-icon svgIcon="plus" />
        Novo Workspace
      </button>
    </div>
  </div>

  <div class="mt-8 flex flex-col items-center gap-2 sm:flex-row">
    <mat-form-field class="small w-full sm:max-w-96" subscriptSizing="dynamic">
      <mat-icon svgIcon="search" matIconPrefix />
      <input
        matInput
        placeholder="Buscar por nome, chave (Key) ou descrição..."
        autocomplete="off"
        [(ngModel)]="search"
        (ngModelChange)="loadList()"
      />
      @if (search !== '') {
        <button matIconButton matIconSuffix (click)="onFilterClear()">
          <mat-icon svgIcon="x" />
        </button>
      }
    </mat-form-field>
  </div>

  <div class="mt-4 flex flex-col">
    <div class="relative isolate overflow-x-auto overflow-y-hidden rounded-lg border border-neutral-a4">
      <table class="w-full whitespace-nowrap" mat-table [dataSource]="list()">
        <!-- Coluna: Workspace -->
        <ng-container matColumnDef="name">
          <th class="md:w-72" mat-header-cell *matHeaderCellDef>Workspace</th>
          <td mat-cell *matCellDef="let row">
            <div class="flex items-center gap-x-3">
              <div class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary-a3 text-primary-a11">
                <mat-icon class="size-4" [svgIcon]="row.icon || 'layout-grid'" />
              </div>
              <div class="flex items-center gap-x-2">
                <span class="mpx-body-medium font-medium text-neutral-12">{{ row.name }}</span>
                @if (row.default) {
                  <span
                    class="inline-flex items-center gap-x-1 rounded-full bg-primary-a3 px-2 py-0.5 text-xs font-medium text-primary-a11"
                  >
                    <mat-icon class="size-3" svgIcon="star" />
                    Padrão
                  </span>
                }
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Coluna: Chave (Key) -->
        <ng-container matColumnDef="key">
          <th class="max-sm:hidden md:w-44" mat-header-cell *matHeaderCellDef>Chave (Key)</th>
          <td class="max-sm:hidden" mat-cell *matCellDef="let row">
            <code
              class="cursor-pointer rounded bg-primary-a3 px-2 py-0.5 font-mono text-xs text-primary-11 transition-colors hover:bg-primary-a4"
              (click)="copyKey(row.key)"
            >
              {{ row.key }}
            </code>
          </td>
        </ng-container>

        <!-- Coluna: Descrição -->
        <ng-container matColumnDef="description">
          <th class="max-lg:hidden" mat-header-cell *matHeaderCellDef>Descrição</th>
          <td class="max-lg:hidden" mat-cell *matCellDef="let row">
            <span class="mpx-body-small text-neutral-a11">{{ row.description || '—' }}</span>
          </td>
        </ng-container>

        <!-- Coluna: Ações -->
        <ng-container matColumnDef="actions">
          <th class="w-12" mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <button matIconButton [matMenuTriggerFor]="rowMenu" class="tiny mx-auto">
              <mat-icon svgIcon="ellipsis-vertical" />
            </button>
            <mat-menu xPosition="before" #rowMenu="matMenu">
              <button mat-menu-item (click)="editEntity(row)">
                <mat-icon svgIcon="square-pen" />
                <span>Editar workspace</span>
              </button>
              @if (!row.default) {
                <button mat-menu-item (click)="setAsDefault(row)">
                  <mat-icon svgIcon="star" />
                  <span>Definir como padrão</span>
                </button>
              }
              <mat-divider />
              <button
                mat-menu-item
                class="text-red-a11 hover:bg-red-a3"
                [disabled]="row.system"
                (click)="deleteEntity(row)"
              >
                <mat-icon svgIcon="trash" class="text-red-a11" />
                <span>Excluir workspace</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>

  <mpx-filter
    [filterService]="workspaceFilterService"
    (onFilter)="onFilter()"
    (onFilterClean)="onFilterClear()"
    (onFilterClose)="onFilterClose()"
  />
</div>
