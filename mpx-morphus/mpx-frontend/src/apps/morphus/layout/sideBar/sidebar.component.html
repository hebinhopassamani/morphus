<aside buiSidebar class="relative w-auto flex-auto overflow-hidden lg:-me-2">
  <!-- Background Art da Barra Lateral: usa a mesma Onda de Cristal + Engrenagens da tela de Seleção de Corporação -->
  @if (theming.sidebarScheme() === 'dark') {
    <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden bg-[#0D061A] select-none">
      <img
        src="/brand/bg-crystal-wave.jpg"
        alt=""
        class="h-full w-full object-cover object-[68%_center] opacity-55"
      />
      <div class="absolute inset-0 bg-gradient-to-b from-[#0D061A]/65 via-[#0D061A]/35 to-[#0D061A]/60"></div>
    </div>
  } @else {
    <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden bg-white select-none">
      <img
        src="/brand/bg-crystal-wave-light.jpg"
        alt=""
        class="h-full w-full object-cover object-[68%_center] opacity-75"
      />
      <div class="absolute inset-0 bg-gradient-to-b from-white/55 via-white/25 to-white/45"></div>
    </div>
  }

  <!-- Header (Padrão Fuse + Identidade Cristal Morphus) -->
  <div buiSidebarHeader class="relative z-10 flex flex-col gap-y-5 px-5.5 pb-4">
    <div class="flex items-center justify-between">
      <a class="inline-flex items-center gap-x-3 rounded-xl" routerLink="/admin">
        <div class="flex size-10 items-center justify-center overflow-hidden rounded-xl border border-[#00E5FF]/35 bg-[#120924] p-0.5 shadow-sm">
          <img src="/brand/app-icon-crystal.jpg" alt="Morphus logo" class="size-full rounded-[10px] object-cover" />
        </div>
        <div class="flex flex-col gap-y-0.5">
          <div
            class="bg-gradient-to-r from-[#00E5FF] via-[#A855F7] to-[#FF007A] bg-clip-text text-2xl leading-none font-extrabold tracking-tight uppercase text-transparent"
          >
            MORPHUS
          </div>
          <div class="text-xs leading-none font-medium text-neutral-a10">
            Do que você precisa hoje?
          </div>
        </div>
      </a>
    </div>
  </div>

  <!-- Body com o componente reutilizável MpxMenuComponent -->
  <div buiSidebarBody class="relative z-10">
    <mpx-menu
      [source]="context.menus()"
      [loading]="context.isLoadingMenus()"
    />

    <div buiSidebarSpacer></div>
  </div>

  <!-- Footer com Workspace em destaque no topo e troca rápida em 1 clique -->
  <div buiSidebarFooter class="relative z-10 p-4">
    <button
      matButton
      [matMenuTriggerFor]="contextMenu"
      class="tertiary small w-full [--button-padding-x:0.375rem] [--button-padding-y:0.375rem]"
    >
      <span class="me-2 flex min-w-0 flex-auto items-center gap-x-3">
        <span
          class="flex size-9 shrink-0 items-center justify-center overflow-hidden rounded-md bg-primary-a3 text-primary-a11"
        >
          @if (context.isImageIcon(context.activeWorkspace()?.icon)) {
            <img
              class="size-9 object-cover"
              [src]="context.activeWorkspace()!.icon!"
              [alt]="context.activeWorkspace()?.name || 'Workspace'"
            />
          } @else {
            <mat-icon
              class="size-5"
              [svgIcon]="context.activeWorkspace()?.icon || 'layout-grid'"
            />
          }
        </span>

        <span class="min-w-0 text-start">
          <span class="block truncate font-semibold">
            {{ context.activeWorkspace()?.name || 'Morphus Workspace' }}
          </span>
          <span class="block truncate text-xs text-neutral-a11">
            Espaço de trabalho
          </span>
        </span>
      </span>

      <mat-icon
        class="ms-auto me-1"
        svgIcon="ellipsis-vertical"
        iconPositionEnd
      />
    </button>

    <!-- Menu de Contexto: Workspace em destaque no topo + Troca em 1 clique (alinhado exatamente à largura do botão na barra lateral) -->
    <mat-menu
      class="w-[216px]! min-w-[216px]! max-w-[216px]!"
      xPosition="after"
      #contextMenu="matMenu"
    >
      <!-- Cabeçalho do Workspace ativo -->
      <div class="not-mat-menu-wrapper flex flex-row! items-center px-2.5 py-2 select-none">
        <div
          class="flex size-9 shrink-0 items-center justify-center overflow-hidden rounded-lg bg-primary-a4 text-primary-a11"
        >
          @if (context.isImageIcon(context.activeWorkspace()?.icon)) {
            <img
              class="size-9 object-cover"
              [src]="context.activeWorkspace()!.icon!"
              [alt]="context.activeWorkspace()?.name || 'Workspace'"
            />
          } @else {
            <mat-icon
              class="size-5! text-primary-a11!"
              [svgIcon]="context.activeWorkspace()?.icon || 'layout-grid'"
            />
          }
        </div>
        <div class="ms-3 flex min-w-0 flex-auto flex-col">
          <div class="truncate text-base font-medium text-neutral-12">
            {{ context.activeWorkspace()?.name || 'Morphus Workspace' }}
          </div>
          <div class="truncate text-xs text-neutral-a11">
            Espaço de trabalho ativo
          </div>
        </div>
      </div>

      <mat-divider />

      <!-- Lista direta de Workspaces para troca em 1 clique -->
      @for (ws of context.workspaces(); track ws.id) {
        <button
          mat-menu-item
          (click)="selectWorkspace(ws)"
        >
          <mat-pseudo-checkbox
            appearance="minimal"
            [state]="context.activeWorkspace()?.id === ws.id ? 'checked' : 'unchecked'"
          />
          <span class="ms-1.5 inline-flex items-center gap-x-2">
            @if (context.isImageIcon(ws.icon)) {
              <img
                class="size-4 shrink-0 rounded-xs object-cover"
                [src]="ws.icon!"
                alt=""
              />
            } @else {
              <mat-icon
                class="size-4 shrink-0"
                [svgIcon]="ws.icon || 'layout-grid'"
              />
            }
            <span>{{ ws.name }}</span>
          </span>
        </button>
      }
    </mat-menu>
  </div>
</aside>
