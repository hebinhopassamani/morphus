@if (showTopBar()) {
  <!-- Barra de progresso superior correndo da esquerda para a direita logo abaixo dos favoritos -->
  <div class="fixed inset-x-0 top-0 z-[10000] h-1 overflow-hidden bg-primary-a4">
    <div class="mpx-top-progress-bar h-full w-1/3 rounded-full bg-primary-9"></div>
  </div>
}

@if (showFullOverlay()) {
  <!-- Overlay de página inteira semitransparente estilo Hostinger -->
  <div
    class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-surface/60 backdrop-blur-[3px] transition-opacity duration-200"
    role="status"
    aria-live="polite"
  >
    <div class="flex flex-col items-center rounded-2xl border border-neutral-a4 bg-surface-container-lowest/90 px-8 py-6 shadow-xl">
      <div class="relative flex size-16 items-center justify-center">
        <div class="absolute inset-0 animate-ping rounded-full bg-primary-a3 opacity-60"></div>
        <div class="absolute inset-0 animate-spin rounded-full border-4 border-primary-a4 border-t-primary-9"></div>
        <img src="/logo-icon.png" alt="Morphus" class="relative size-8 object-contain" />
      </div>
      <span class="mt-3.5 text-xs font-semibold tracking-wide text-neutral-a11">
        Processando com segurança...
      </span>
    </div>
  </div>
}

<router-outlet />
