<div class="sticky top-0 z-99 flex items-center gap-x-2 border-b bg-white py-2.5 ps-4 pe-5 dark:bg-neutral-2">
  <a class="inline-flex items-center gap-x-3 rounded-xl" routerLink="/">
    <div class="flex size-9 items-center justify-center rounded-xl border bg-neutral-a3 p-1.5">
      <img src="/logo-icon-sm.png" alt="Morphus logo" class="size-7 object-contain" />
    </div>
    <div class="flex flex-col gap-y-0.5">
      <div class="text-2xl leading-none font-bold tracking-tighter uppercase text-neutral-12">
        MORPHUS
      </div>
      <div class="text-xs leading-none font-medium text-neutral-a10">
        Do que você precisa hoje?
      </div>
    </div>
  </a>

  <div class="flex-auto"></div>

  <button matIconButton (click)="toggleScheme()">
    <mat-icon [svgIcon]="isDark() ? 'sun' : 'moon'" />
  </button>

  @if (auth.isAuthenticated() && auth.user(); as user) {
    <button
      type="button"
      [matMenuTriggerFor]="secUserMenu"
      class="flex cursor-pointer items-center gap-x-3 rounded-xl border border-neutral-a4 bg-surface-container-low/60 px-3 py-1.5 text-start transition hover:bg-neutral-a3"
    >
      @if (user.picture; as picture) {
        <img
          class="size-8 shrink-0 overflow-hidden rounded-lg object-cover"
          [src]="picture"
          alt="Avatar do usuário"
        />
      } @else {
        <div
          class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary-a3 text-xs font-semibold text-primary-a11"
        >
          {{ userInitials() }}
        </div>
      }

      <div class="hidden min-w-0 flex-col gap-y-0.5 leading-tight sm:flex">
        <span class="max-w-44 truncate text-xs font-semibold text-on-surface">
          {{ user.name || 'Usuário Morphus' }}
        </span>
        <span class="max-w-44 truncate text-[11px] text-neutral-a11">
          {{ user.email }}
        </span>
      </div>

      <mat-icon class="ms-1 size-4! shrink-0 text-neutral-a10" svgIcon="chevron-down" />
    </button>

    <mat-menu #secUserMenu="matMenu" xPosition="before" class="min-w-56">
      <div class="flex items-center gap-x-3 px-4 py-2.5 select-none">
        @if (user.picture; as picture) {
          <img
            class="size-9 shrink-0 rounded-lg object-cover"
            [src]="picture"
            alt="Avatar do usuário"
          />
        } @else {
          <div
            class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-primary-a4 text-sm font-semibold text-primary-a11"
          >
            {{ userInitials() }}
          </div>
        }
        <div class="flex min-w-0 flex-col">
          <span class="truncate text-sm font-semibold">
            {{ user.name || 'Usuário Morphus' }}
          </span>
          <span class="truncate text-xs text-neutral-a11">
            {{ user.email }}
          </span>
        </div>
      </div>

      <mat-divider />

      <button mat-menu-item (click)="auth.logout()">
        <mat-icon svgIcon="log-out" />
        <span>Sair / Trocar de conta</span>
      </button>
    </mat-menu>
  }
</div>
