<div class="sticky top-0 z-99 flex items-center gap-x-2 border-b bg-white py-3 ps-4 pe-5 dark:bg-neutral-2">

    <img src="/logo-horizontal-sm.png" alt="Morphus" class="h-8 w-auto object-contain" />
  </a>
  <div class="flex-auto"></div>

</div>
