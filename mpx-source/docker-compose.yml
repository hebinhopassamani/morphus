volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  n8n_postgres_data:
  n8n_data:

services:
  mpx-reverse-proxy:
    image: caddy:latest
    container_name: mpx-reverse-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      MORPHUS_DOMAIN: ${MORPHUS_DOMAIN:?Defina MORPHUS_DOMAIN no arquivo .env}
      KALUPA_DOMAIN: ${KALUPA_DOMAIN:?Defina KALUPA_DOMAIN no arquivo .env}
    volumes:
      - ./mpx-reverse-proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mpx-frontend
      - mpx-kalupa

  mpx-frontend:
    build:
      context: ./mpx-morphus/mpx-frontend
      dockerfile: Dockerfile
      args:
        NG_CONFIG: ${NG_CONFIG:-production}
    container_name: mpx-frontend
    restart: unless-stopped
    depends_on:
      - mpx-backend

  mpx-backend:
    build:
      context: ./mpx-morphus/mpx-backend
      dockerfile: Dockerfile
    container_name: mpx-backend
    restart: unless-stopped
    depends_on:
      mpx-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=mpx-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};
      POSTGRES_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}

  mpx-postgres:
    image: postgres:18-alpine
    container_name: mpx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  mpx-kalupa-db:
    image: postgres:18-alpine
    container_name: mpx-kalupa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KALUPA_USER:?Defina KALUPA_USER no arquivo .env}
      POSTGRES_PASSWORD: ${KALUPA_PASSWORD:?Defina KALUPA_PASSWORD no arquivo .env}
      POSTGRES_DB: ${KALUPA_DB:?Defina KALUPA_DB no arquivo .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - n8n_postgres_data:/var/lib/postgresql

  mpx-kalupa:
    image: docker.io/n8nio/n8n:latest
    container_name: mpx-kalupa
    restart: unless-stopped
    depends_on:
      mpx-kalupa-db:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=mpx-kalupa-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${KALUPA_DB:?Defina KALUPA_DB no arquivo .env}
      - DB_POSTGRESDB_USER=${KALUPA_USER:?Defina KALUPA_USER no arquivo .env}
      - DB_POSTGRESDB_PASSWORD=${KALUPA_PASSWORD:?Defina KALUPA_PASSWORD no arquivo .env}
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_HOST=${KALUPA_PUBLIC_DOMAIN:?Defina KALUPA_PUBLIC_DOMAIN no arquivo .env}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${KALUPA_PUBLIC_DOMAIN}/
      - N8N_WEBHOOK_URL=https://${KALUPA_PUBLIC_DOMAIN}/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - /files/docker-data/n8n:/home/node/.n8n
      - ${PROJECT_ROOT:?Defina PROJECT_ROOT}/mpx-kalupa/data:/files
