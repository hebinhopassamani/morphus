<!doctype html>
<html
  id="bui"
  lang="en"
>
  <head>
    <base href="/" />
    <title>Spark - Angular Starter Template</title>

    <!-- Meta -->
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Starter application template built with BuilderKit and modern Angular."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="favicon.png"
    />

    <!-- Fonts -->
    <link
      rel="preload"
      href="/fonts/inter/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter/InterVariable-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/commit-mono/CommitMonoVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- prettier-ignore -->
    <script>
      !function(){try{const e=document.documentElement.classList;e.remove("scheme-dark","scheme-light");const c=localStorage.getItem("scheme"),t=window.matchMedia("(prefers-color-scheme: dark)").matches,s="dark"===c||"system"===c&&t?"scheme-dark":"scheme-light";e.add(s)}catch(e){}}();
    </script>
    <app-root></app-root>
  </body>
</html>
