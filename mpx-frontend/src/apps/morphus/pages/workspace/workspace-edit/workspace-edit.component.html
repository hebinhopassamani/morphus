<div class="mx-auto flex w-full max-w-3xl flex-col p-6">
  <div class="flex items-center gap-x-3">
    <button matIconButton type="button" (click)="onCancel()">
      <mat-icon svgIcon="arrow-left" />
    </button>
    <div>
      <h2 class="mpx-headline-medium text-neutral-12">{{ title1() }}</h2>
      <p class="mt-0.5 mpx-body-medium text-neutral-a11">{{ title2() }}</p>
    </div>
  </div>

  <form
    #workspaceForm="ngForm"
    (ngSubmit)="workspaceForm.form.valid && onSave()"
    class="mt-8 flex flex-col gap-y-5 rounded-xl border border-neutral-a4 bg-white p-6 dark:bg-neutral-2"
  >
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <!-- Nome do Workspace -->
      <mat-form-field>
        <mat-label>Nome do Workspace</mat-label>
        <input
          matInput
          name="name"
          placeholder="Ex.: Principal, Financeiro, Operações..."
          required
          minlength="2"
          maxlength="100"
          [ngModel]="entity().name"
          (ngModelChange)="updateField('name', $event)"
          #nameCtrl="ngModel"
        />
        <mat-error class="morphus-mat-error">
          <span class="morphus-mat-error-label">{{ validator.showErros(nameCtrl) }}</span>
        </mat-error>
      </mat-form-field>

      <!-- Chave Única (Key) -->
      <mat-form-field
        class="cursor-pointer"
        [matTooltip]="keyCopied() ? 'Copiado para a área de transferência!' : 'Clique para copiar a Chave Única'"
        (click)="copyKey()"
      >
        <mat-label>
          {{ keyCopied() ? 'Chave Única (Copiada! ✓)' : 'Chave Única (SDK Key)' }}
        </mat-label>
        <input
          matInput
          name="key"
          readonly
          class="cursor-pointer font-mono select-all opacity-75"
          [ngModel]="entity().key"
        />
      </mat-form-field>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      <!-- Seletor Visual de Ícones e Cores -->
      <mpx-icon-selector
        label="Ícone do Workspace"
        defaultIcon="layout-grid"
        [value]="entity().icon"
        (valueChange)="updateField('icon', $event)"
      />

      <!-- Switch de Workspace Padrão (Default) -->
      <div class="mpx-workspace-default-card">
        <div class="flex flex-col">
          <span class="mpx-body-medium font-medium text-neutral-12">
            Workspace padrão da corporação
          </span>
          <span class="mpx-body-small text-neutral-a11">
            Carregado automaticamente ao entrar na corporação.
          </span>
        </div>
        <mat-slide-toggle
          name="default"
          [ngModel]="entity().default"
          (ngModelChange)="updateField('default', $event)"
        />
      </div>
    </div>

    <!-- Descrição (Textarea) -->
    <mat-form-field>
      <mat-label>Descrição</mat-label>
      <textarea
        matInput
        name="description"
        rows="3"
        placeholder="Descreva a finalidade deste espaço de trabalho..."
        maxlength="255"
        [ngModel]="entity().description"
        (ngModelChange)="updateField('description', $event)"
      ></textarea>
    </mat-form-field>

    <div class="mt-2 flex items-center justify-end gap-x-3 border-t border-neutral-a4 pt-4">
      <button matButton type="button" (click)="onCancel()">
        Cancelar
      </button>
      <button
        matButton
        class="primary"
        type="submit"
        [disabled]="workspaceForm.invalid"
      >
        <mat-icon svgIcon="check" />
        {{ isEditing() ? 'Salvar Alterações' : 'Criar Workspace' }}
      </button>
    </div>
  </form>
</div>
