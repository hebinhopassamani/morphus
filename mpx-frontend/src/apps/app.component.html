@if (showTopBar()) {
  <!-- Barra de progresso superior correndo da esquerda para a direita logo abaixo dos favoritos -->
  <div class="fixed inset-x-0 top-0 z-[10000] h-1 overflow-hidden bg-primary-a4">
    <div class="mpx-top-progress-bar h-full w-1/3 rounded-full bg-primary-9"></div>
  </div>
}

@if (showFullOverlay()) {
  <!-- Overlay de página inteira com fundo colorido bem suave e quase transparente -->
  <div
    class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-primary-a3/45 backdrop-blur-[1.5px] transition-opacity duration-200 dark:bg-primary-a2/55"
    role="status"
    aria-live="polite"
  >
    <div class="flex flex-col items-center rounded-2xl border border-primary-a5 bg-surface-container-lowest/80 px-8 py-6 shadow-lg backdrop-blur-md">
      <div class="relative flex size-16 items-center justify-center">
        <div class="absolute inset-0 animate-ping rounded-full bg-primary-a4 opacity-60"></div>
        <div class="absolute inset-0 animate-spin rounded-full border-4 border-primary-a4 border-t-primary-9"></div>
        <img src="/brand/favicon_light_512.png" alt="Morphus" class="relative size-9 rounded-lg object-cover dark:hidden" />
        <img src="/brand/favicon_dark_512.png" alt="Morphus" class="relative hidden size-9 rounded-lg object-cover dark:block" />
      </div>
      <span class="mt-3.5 text-xs font-semibold tracking-wide text-primary-a11">
        Processando com segurança...
      </span>
    </div>
  </div>
}

<router-outlet />
<mpx-message />
