<div
  buiDialog
  class="w-full max-w-5xl"
  [(open)]="filterService().filterOpened"
  [autoFocus]="undefined"
>
  <ng-template buiDialogPortal>
    <div buiDialogBackdrop></div>

    <div buiDialogContent class="max-w-none gap-y-4 p-4 sm:p-6">
      <!-- Cabeçalho do Modal -->
      <div buiDialogHeader class="flex flex-row items-start justify-between gap-x-4">
        <div class="flex items-start gap-x-3.5">
          <div
            class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-primary-a3 text-primary-11"
          >
            <mat-icon class="size-5" svgIcon="sliders-horizontal" />
          </div>
          <div class="flex flex-col">
            <div buiDialogTitle class="mpx-title-large text-neutral-12">
              {{ title() }}
            </div>
            <div buiDialogDescription class="mt-0.5 mpx-body-small text-neutral-a11">
              {{ subtitle() }}
            </div>
          </div>
        </div>

        <button
          matIconButton
          type="button"
          class="tiny -mt-1 -mr-1 text-neutral-a11 hover:text-neutral-12"
          buiDialogClose
          matTooltip="Voltar"
          (click)="closeClick()"
        >
          <mat-icon svgIcon="x" />
        </button>
      </div>

      <mat-divider />

      <!-- Lista de Linhas de Filtro (MpxFilterAttributeComponent) -->
      <div buiDialogBody class="flex max-h-[70vh] flex-col gap-y-3 overflow-y-auto py-1">
        @for (filterRow of filterService().filterRows(); track filterRow.id) {
          <mpx-filter-attribute
            [columns]="filterService().filterColumns()"
            [filterRow]="filterRow"
            (onNewFilterRow)="onNewFilterRow($event)"
            (onDeleteFilterRow)="onDeleteFilterRow($event)"
            (onOptionListSelected)="optionSelected($event)"
          />
        }
      </div>

      <mat-divider />

      <!-- Rodapé: Limpar o filtro, Voltar e Filtrar -->
      <div buiDialogFooter class="flex w-full items-center justify-end gap-x-3">
        <button
          matButton
          type="button"
          matTooltip="Limpar o filtro"
          (click)="cleanClick()"
        >
          <mat-icon svgIcon="rotate-ccw" />
          Limpar
        </button>

        <button
          matButton
          type="button"
          matTooltip="Voltar"
          (click)="closeClick()"
        >
          <mat-icon svgIcon="arrow-left" />
          Voltar
        </button>

        <button
          matButton
          type="button"
          class="primary"
          matTooltip="Filtrar"
          (click)="filterClick()"
        >
          <mat-icon svgIcon="search" />
          Filtrar
        </button>
      </div>
    </div>
  </ng-template>
</div>
