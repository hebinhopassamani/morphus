<div class="relative sticky top-0 z-99 flex items-center gap-x-1 overflow-hidden border-b bg-[#F7F5FC] py-2.5 ps-4 pe-5 dark:bg-[#140A2E]">
  <!-- Arte Oficial Topbar (Change Log 2: topbar_light.jpg / topbar_dark.jpg) -->
  <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden select-none">
    <img
      src="/brand/topbar_light.jpg"
      alt=""
      class="h-full w-full object-cover object-right opacity-90 dark:hidden"
    />
    <img
      src="/brand/topbar_dark.jpg"
      alt=""
      class="hidden h-full w-full object-cover object-right opacity-90 dark:block"
    />
  </div>

  <!-- Toggle da Sidebar -->
  <button
    matIconButton
    class="relative z-10"
    (click)="menuToggle.emit()"
    matTooltip="Alternar menu lateral"
  >
    <mat-icon svgIcon="panel-left" />
  </button>

  <div class="flex-auto"></div>

  <!-- Quick Settings (Pincel do Fuse) -->
  <mpx-quick-settings class="relative z-10" />

  <!-- Botão do Avatar do Usuário no canto superior direito (Padrão Fuse compact) -->
  <button
    matButton
    [matMenuTriggerFor]="userMenu"
    class="tiny tertiary relative z-10 [--button-padding-x:0.25rem] [--button-padding-y:0.25rem]"
  >
    @if (auth.user()?.picture; as picture) {
      <img
        class="size-6 shrink-0 overflow-hidden rounded-md object-cover"
        [src]="picture"
        alt="User Avatar"
      />
    } @else {
      <div
        class="flex size-6 shrink-0 items-center justify-center rounded-md bg-primary-a3 text-xs font-semibold text-primary-a11"
      >
        {{ userInitials() }}
      </div>
    }
  </button>

  <!-- User Menu (Original do Fuse) -->
  <mat-menu
    class="min-w-52"
    xPosition="before"
    #userMenu="matMenu"
  >
    <button mat-menu-item>
      @if (auth.user()?.picture; as picture) {
        <img
          class="size-9 shrink-0 rounded-lg object-cover"
          [src]="picture"
          alt="User avatar"
        />
      } @else {
        <div
          class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-primary-a4 mpx-title-small text-primary-a11"
        >
          {{ userInitials() }}
        </div>
      }
      <div class="ms-3 flex min-w-0 flex-auto flex-col select-none">
        <div class="truncate text-lg font-medium">
          {{ auth.user()?.name || 'John Builder' }}
        </div>
        <div class="truncate text-sm text-neutral-a11">
          {{ auth.user()?.email || 'john@example.com' }}
        </div>
      </div>
    </button>

    <mat-divider />

    @if (auth.availableCorporations().length > 1) {
      <button
        mat-menu-item
        (click)="auth.openCorporationSelector('/admin', 'security')"
      >
        <mat-icon svgIcon="building-2" />
        <span>Trocar corporação ({{ auth.corporation()?.name || 'Ativa' }})</span>
      </button>

      <mat-divider />
    }

    <button mat-menu-item>
      <mat-icon svgIcon="sparkles" />
      Upgrade to Pro
    </button>

    <mat-divider />

    <a
      mat-menu-item
      routerLink="/admin/settings/profile"
    >
      <mat-icon svgIcon="circle-user" />
      <span>Account</span>
    </a>

    <a
      mat-menu-item
      routerLink="/admin/settings/notifications"
    >
      <mat-icon svgIcon="bell" />
      <span>Notifications</span>
    </a>

    <mat-divider />

    <button
      mat-menu-item
      [matMenuTriggerFor]="schemeMenu"
    >
      <mat-icon svgIcon="sun-moon" />
      <span>Color scheme</span>
    </button>
    <mat-menu #schemeMenu="matMenu">
      @for (item of schemes; track item.value) {
        <button
          mat-menu-item
          (click)="updateScheme(item.value)"
        >
          <mat-pseudo-checkbox
            appearance="minimal"
            [state]="
              theming.scheme() === item.value ? 'checked' : 'unchecked'
            "
          />
          <span class="ms-1">{{ item.label }}</span>
        </button>
      }
    </mat-menu>

    <a
      mat-menu-item
      routerLink="/admin/settings/preferences"
    >
      <mat-icon svgIcon="sliders-horizontal" />
      <span>Preferences</span>
    </a>

    <mat-divider />

    <button
      mat-menu-item
      (click)="auth.logout()"
    >
      <mat-icon svgIcon="log-out" />
      <span class="flex w-full items-center justify-between gap-x-4">
        <span>Sign out</span>
        @if (auth.expirationTimer()) {
          <span class="rounded bg-neutral-a3 px-1.5 py-0.5 font-mono text-xs text-neutral-a11">
            {{ auth.expirationTimer() }}
          </span>
        }
      </span>
    </button>
  </mat-menu>
</div>
