@if (showTopBar()) {
  <mpx-landing-topbar />
}

@if (isSecurityFlow()) {
  <div class="relative flex min-h-0 w-full flex-auto flex-col overflow-hidden">
    <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden select-none">
      <img
        src="/brands/fundo_web_light.jpg"
        alt=""
        class="block h-full w-full object-cover object-center dark:hidden!"
      />
      <img
        src="/brands/fundo_web_dark.jpg"
        alt=""
        class="hidden h-full w-full object-cover object-center dark:block"
      />
      <div class="absolute inset-0 bg-[#F7F5FC]/15 dark:bg-[#140A2E]/25"></div>
    </div>
    <mpx-landing-content [fullWidth]="true" class="relative z-10" />
  </div>
} @else {
  <mpx-landing-content />
}
